name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Run OCTOCore tests
        working-directory: Packages/OCTOCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log

      # The raw log of a run needs admin rights to download, so what failed is repeated as
      # annotations, which the checks API hands to anyone who can read the repository.
      - name: Report failing tests
        if: failure()
        working-directory: Packages/OCTOCore
        run: |
          grep -E "✘|error:|Expectation failed|recorded an issue|Fatal error" swift-test.log \
            | sed -E 's#^.*/(Packages|Sources|Tests)/#\1/#' | sort -u | head -20 \
            | while IFS= read -r line; do echo "::error::${line}"; done || true

  ios:
    name: Build iOS app
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project OCTO.xcodeproj \
            -scheme OCTO \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild.log | xcbeautify --renderer github-actions

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "error:" build/xcodebuild.log | sed -E 's#^.*/(OCTO|Packages)/#\1/#' | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done || true

      - name: Package unsigned IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/OCTO.app"
          test -d "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry OCTO-unsigned.ipa Payload
          ls -lh OCTO-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: OCTO-unsigned-ipa
          path: build/OCTO-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core-tests, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: OCTO-unsigned-ipa
          path: dist

      - name: Prepare release notes and IPA
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" <<'PY'
          import re
          import sys

          version = sys.argv[1]
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          section = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", changelog, re.S | re.M)
          notes = section.group(1).strip() if section else f"OCTO {version}"
          notes += "\n\n---\n\nIPA non signé pour iOS 26 : installe-le avec AltStore, SideStore ou Sideloadly."
          with open("release-notes.md", "w", encoding="utf-8") as output:
              output.write(notes + "\n")
          PY
          mv dist/OCTO-unsigned.ipa "dist/OCTO-${version}.ipa"
          ls -l dist

      - uses: softprops/action-gh-release@v3
        with:
          name: OCTO ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/OCTO-*.ipa
          fail_on_unmatched_files: true
