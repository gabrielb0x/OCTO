name: Screenshots

# Runs the app's demo scenes on an iPhone simulator and commits the framed
# screenshots to docs/screenshots. It comes last: only once the Build workflow
# (tests and IPA) has passed on a branch, so a release never waits for it, and
# never for a version tag.
#
# Only the six screens of the README are captured, and only when the app changed
# since the last screenshots. The whole gallery is captured when the version
# changes. More scenes can be asked for in the commit message with
# "[screenshots: usage, telemetry]" or "[screenshots: all]", or by running the
# workflow by hand.
on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      scenes:
        description: 'Scenes: "readme", "all", or names separated by spaces'
        required: false
        default: "readme"

concurrency:
  group: screenshots-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  plan:
    name: Choose scenes
    # A build that passed for a push to a branch; a tag like v2.0.0 is a release, already captured.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       !(startsWith(github.event.workflow_run.head_branch, 'v') && contains(github.event.workflow_run.head_branch, '.')))
    runs-on: ubuntu-latest
    outputs:
      scenes: ${{ steps.scenes.outputs.scenes }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Choose scenes
        id: scenes
        env:
          REQUESTED: ${{ github.event.inputs.scenes }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          # What changed since the screenshots were last taken.
          last=$(git log --format=%H -n 1 --grep='^Update screenshots' || true)
          changed=yes
          version_changed=no
          if [ -n "$last" ]; then
            if [ -z "$(git diff --name-only "$last" HEAD -- OCTO Packages project.yml Scripts .github/workflows/screenshots.yml)" ]; then
              changed=no
            fi
            if git diff "$last" HEAD -- project.yml | grep -q '^+.*MARKETING_VERSION'; then
              version_changed=yes
            fi
          fi
          asked=$(printf '%s' "$COMMIT_MESSAGE" | grep -oE '\[screenshots:[^]]*\]' | head -n 1 | sed -E 's/^\[screenshots:[[:space:]]*//; s/\]$//' || true)

          scenes=""
          if [ -n "$REQUESTED" ]; then
            scenes="$REQUESTED"
          elif [ "$version_changed" = yes ]; then
            # A new version: the whole gallery is brought up to date.
            scenes="all"
          elif [ -n "$asked" ]; then
            scenes="readme $asked"
          elif [ "$changed" = yes ]; then
            scenes="readme"
          fi
          echo "::notice title=Scenes::${scenes:-none, nothing on screen changed}"
          echo "scenes=$scenes" >> "$GITHUB_OUTPUT"

  screenshots:
    name: Capture screenshots
    needs: plan
    if: needs.plan.outputs.scenes != ''
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # The simulator boots while the app builds, instead of after. Started once Homebrew is done,
      # which the boot slows down a lot.
      - name: Start the simulator
        run: Scripts/boot-simulator.sh

      # Optimized, the demo app opens and settles faster for every scene than a debug build.
      - name: Build demo app for the simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project OCTO.xcodeproj \
            -scheme OCTO \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='OCTO_DEMO' \
            2>&1 | tee build/xcodebuild-simulator.log | xcbeautify --renderer github-actions

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "error:" build/xcodebuild-simulator.log | sed -E 's#^.*/(OCTO|Packages)/#\1/#' | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done || true

      - name: Capture screenshots
        env:
          SCENES: ${{ needs.plan.outputs.scenes }}
        run: Scripts/take-screenshots.sh build/DerivedData/Build/Products/Release-iphonesimulator/OCTO.app build/screenshots

      - name: Add device frames
        run: |
          python3 -m venv build/venv
          build/venv/bin/pip install --quiet pillow
          build/venv/bin/python Scripts/frame-screenshots.py build/screenshots docs/screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OCTO-screenshots
          path: |
            build/screenshots
            docs/screenshots
          if-no-files-found: ignore

      # The checkout is the commit that was built: the screenshots go on top of the branch as it
      # is now.
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots are up to date."
            exit 0
          fi
          git commit -m "Update screenshots [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
