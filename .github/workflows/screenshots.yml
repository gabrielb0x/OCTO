name: Screenshots

# Runs the app's demo scenes on an iPhone simulator and commits the framed
# screenshots to docs/screenshots. A push only captures the six screens of the
# README; the whole gallery is captured when the version changes. More scenes
# can be asked for in the commit message: "[screenshots: usage, telemetry]", or
# "[screenshots: all]".
on:
  push:
    branches: ["**"]
    paths:
      - "OCTO/**"
      - "Packages/**"
      - "project.yml"
      - "Scripts/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:
    inputs:
      scenes:
        description: 'Scenes: "readme", "all", or names separated by spaces'
        required: false
        default: "readme"

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshots:
    name: Capture screenshots
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Choose scenes
        id: scenes
        env:
          REQUESTED: ${{ github.event.inputs.scenes }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
        run: |
          scenes="readme"
          asked=$(printf '%s' "$COMMIT_MESSAGE" | grep -oE '\[screenshots:[^]]*\]' | head -n 1 | sed -E 's/^\[screenshots:[[:space:]]*//; s/\]$//' || true)
          if [ -n "$REQUESTED" ]; then
            scenes="$REQUESTED"
          else
            if [ -n "$asked" ]; then
              scenes="readme $asked"
            fi
            if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              && git diff "$BEFORE" HEAD -- project.yml | grep -q '^+.*MARKETING_VERSION'; then
              # A new version: the whole gallery is brought up to date.
              scenes="all"
            fi
          fi
          echo "::notice title=Scenes::$scenes"
          echo "scenes=$scenes" >> "$GITHUB_OUTPUT"

      # The simulator boots while the app builds, instead of after.
      - name: Start the simulator
        run: Scripts/boot-simulator.sh

      # Optimized, the demo app opens and settles faster for every scene than a debug build.
      - name: Build demo app for the simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project OCTO.xcodeproj \
            -scheme OCTO \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='OCTO_DEMO' \
            2>&1 | tee build/xcodebuild-simulator.log | xcbeautify --renderer github-actions

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "error:" build/xcodebuild-simulator.log | sed -E 's#^.*/(OCTO|Packages)/#\1/#' | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done || true

      - name: Capture screenshots
        env:
          SCENES: ${{ steps.scenes.outputs.scenes }}
        run: Scripts/take-screenshots.sh build/DerivedData/Build/Products/Release-iphonesimulator/OCTO.app build/screenshots

      - name: Add device frames
        run: |
          python3 -m venv build/venv
          build/venv/bin/pip install --quiet pillow
          build/venv/bin/python Scripts/frame-screenshots.py build/screenshots docs/screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OCTO-screenshots
          path: |
            build/screenshots
            docs/screenshots
          if-no-files-found: ignore

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots are up to date."
            exit 0
          fi
          git commit -m "Update screenshots [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
