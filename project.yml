name: OCTO

options:
  bundleIdPrefix: com.gabrielb0x
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  OCTOCore:
    path: Packages/OCTOCore

settings:
  base:
    MARKETING_VERSION: "1.9.0"
    CURRENT_PROJECT_VERSION: "12"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

targets:
  OCTO:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: OCTO
    dependencies:
      - package: OCTOCore
    info:
      path: OCTO/Resources/Info.plist
      properties:
        CFBundleDisplayName: OCTO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: OCTO uses the camera so you can send photos in a chat.
        NSFaceIDUsageDescription: OCTO uses Face ID to lock the app so only you can open your chats.
        NSMicrophoneUsageDescription: OCTO uses the microphone for dictation and voice mode.
        NSSpeechRecognitionUsageDescription: OCTO transcribes your voice on your device to write your message.
        NSLocalNetworkUsageDescription: OCTO briefly listens on this device (localhost) to receive the ChatGPT sign-in response.
        # Lets the update sheet offer AltStore and SideStore when they're installed.
        LSApplicationQueriesSchemes: [altstore, sidestore]
        CFBundleURLTypes:
          - CFBundleURLName: com.gabrielb0x.octo.auth
            CFBundleURLSchemes: [octo]
    settings:
      base:
        PRODUCT_NAME: OCTO
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielb0x.octo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
